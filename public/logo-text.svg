<svg width="350" height="150" viewBox="0 0 350 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (optional) -->
  <rect width="350" height="150" fill="none"/>
  
  <!-- BIRD text outline (light brown) -->
  <text x="40" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" stroke="#D2B48C" stroke-width="3" fill="none">BIRD</text>
  <!-- BIRD text fill (green) -->
  <text x="40" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#4A5D23">BIRD</text>
  
  <!-- CAGE text (light brown fill) - moved closer to BIRD -->
  <text x="175" y="100" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#D2B48C">CAGE</text>
  
  <!-- Little bird above the 'i' in BIRD - positioned directly above the dot -->
  <!-- Bird body (small green circle) -->
  <ellipse cx="123" cy="48" rx="12" ry="8" fill="#4A5D23" stroke="#D2B48C" stroke-width="1.5"/>
  
  <!-- Bird head -->
  <circle cx="133" cy="43" r="5" fill="#4A5D23" stroke="#D2B48C" stroke-width="1.5"/>
  
  <!-- Bird beak (brown) -->
  <polygon points="138,43 143,44 138,45" fill="#8B5A2B" stroke="#5D3A1A" stroke-width="0.5"/>
  
  <!-- Bird eye -->
  <circle cx="134.5" cy="41.5" r="1" fill="white"/>
  <circle cx="135" cy="41" r="0.3" fill="black"/>
  
  <!-- Bird wing -->
  <path d="M121 46 Q113 38 107 32" stroke="#D2B48C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M121 46 Q113 38 107 32" stroke="#4A5D23" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Bird tail -->
  <path d="M116 50 Q109 52 103 55" stroke="#D2B48C" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M116 50 Q109 52 103 55" stroke="#4A5D23" stroke-width="1" fill="none" stroke-linecap="round"/>
  
  <!-- The dot of the 'i' (visible beneath the bird) -->
  <circle cx="123" cy="100" r="3" fill="#D2B48C"/>
</svg>